// ===== 采购金额统计（今日/本周/本月/累计 + 近7日） =====
function purchaseAmount(po) {
  return (po.items||[]).reduce((s,it)=>s+(it.cost||0)*(it.qty||1),0) + (po.shippingFee||0);
}
function calcPurchaseStats(allPOs) {
  const now = new Date();
  const today = getDateKey(now);
  const mon = new Date(); const dow = (now.getDay()+6)%7; mon.setDate(now.getDate()-dow);
  const monKey = getDateKey(mon);
  const monthPrefix = today.slice(0,7);
  const amt = list => list.reduce((s,p)=>s+purchaseAmount(p),0);
  const todayPOs = allPOs.filter(p=>p.date===today);
  const weekPOs = allPOs.filter(p=>p.date>=monKey && p.date<=today);
  const monthPOs = allPOs.filter(p=>(p.date||'').startsWith(monthPrefix));
  const days = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(now.getDate()-i);
    const k = getDateKey(d);
    const dayPOs = allPOs.filter(p=>p.date===k);
    days.push({ key:k, label: i===0?'今天':k.slice(5), amount: amt(dayPOs), count: dayPOs.length });
  }
  return {
    today: { amount: amt(todayPOs), count: todayPOs.length },
    week:  { amount: amt(weekPOs),  count: weekPOs.length },
    month: { amount: amt(monthPOs), count: monthPOs.length },
    total: { amount: amt(allPOs),   count: allPOs.length },
    days
  };
}

// ===== 到货状态 / 瑕疵标记 =====
const PO_DEFECT_TYPES = ['无', '瑕疵', '破损', '皮裂', '其他'];
function isDefect(it) { return !!(it.defect && it.defect !== '无' && it.defect !== undefined); }
function poItemReceived(it) { return Math.max(0, Math.min(it.receivedQty||0, it.qty||1)); }
function poItemStatus(it) {
  const q = it.qty||1, r = poItemReceived(it);
  if (r <= 0) return '未到货';
  if (r >= q) return '已到货';
  return '部分到货';
}
function poItemStatusTag(it) {
  const s = poItemStatus(it);
  const cls = s === '已到货' ? 'tag-green' : (s === '部分到货' ? 'tag-orange' : 'tag-red');
  return `<span class="tag ${cls}">${s}</span>`;
}
function poHasRemaining(po) { return (po.items||[]).some(it => poItemReceived(it) < (it.qty||1)); }
function poDefectItems(po) { return (po.items||[]).filter(isDefect); }
function poDefectCount(allPOs) { return (allPOs||[]).reduce((s,po)=>s+poDefectItems(po).length, 0); }
function filterDefect() { purchaseFilter = '瑕疵'; renderPurchaseOrders(); }

// ===== v13：超时预警 / 未到货看板 / 一键到货 / 在途资金 =====
const PO_OVERDUE_DAYS = 5;   // 下单超过这个天数还没到货 = 该催了
const PO_CHASE_DAYS = 3;     // 超过这个天数还没单号 = 该催发货
let poSearchKey = '';
let poExpanded = {};
let poView = 'todo';         // todo=待收货看板  all=全部采购单
let poFlashId = '';

function poDaysWaited(po) {
  if (!po.date) return 0;
  const d0 = new Date(po.date + 'T00:00:00');
  if (isNaN(d0.getTime())) return 0;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((today - d0) / 86400000));
}
function poIsSettled(po) { return !poHasRemaining(po); }
function poUrgency(po) {
  if (poIsSettled(po)) return 'done';
  const d = poDaysWaited(po);
  if (d >= PO_OVERDUE_DAYS) return 'overdue';
  if (po.status === '待发货' && d >= PO_CHASE_DAYS) return 'chase';
  if (d >= PO_CHASE_DAYS) return 'warn';
  return 'normal';
}
function poUrgencyHint(po) {
  const u = poUrgency(po), d = poDaysWaited(po);
  if (u === 'overdue') return `已下单 ${d} 天还没到，去查物流`;
  if (u === 'chase')   return `下单 ${d} 天还没发货，去催单`;
  if (u === 'warn')    return `已下单 ${d} 天，在路上`;
  if (u === 'done')    return '已全部到货';
  return '';
}

// P0：跨采购单汇总所有「还没收满」的商品行，按等待天数倒序
function poUnreceivedRows(allPOs) {
  const rows = [];
  (allPOs || []).forEach(po => {
    (po.items || []).forEach((it, idx) => {
      const remain = (it.qty || 1) - poItemReceived(it);
      if (remain <= 0) return;
      rows.push({ po, it, idx, remain, days: poDaysWaited(po) });
    });
  });
  rows.sort((a, b) => b.days - a.days);
  return rows;
}

// P2：在途资金 = 已下单但还没到货的货值
function poTransitStats(allPOs) {
  let transit = 0, stored = 0;
  (allPOs || []).forEach(po => {
    (po.items || []).forEach(it => {
      const q = it.qty || 1, c = it.cost || 0, r = poItemReceived(it);
      transit += c * Math.max(0, q - r);
      stored  += c * r;
    });
  });
  return { transit, stored, total: transit + stored };
}

// 把「某件商品到货 qty 双」的入库逻辑抽出来，弹窗批量收货和列表一键收货共用
function receiveItemIntoStock(data, po, it, qty, cost, shelf) {
  const size = (it.size && String(it.size).trim()) || '均码';
  let prod = getProductBySku(data, it.sku || it.name);
  if (!prod) {
    prod = {
      id: genId('p'), sku: it.sku || it.name || '', name: it.name || it.sku || '商品', brand: '',
      sizes: [], condition: it.condition || '全新', cost: 0, price: 0,
      status: '正常可售', shelf: shelf || '', platform: po.platform, device: it.device || po.device || '',
      purchaseOrderNo: po.id, thumb: it.thumb || null, flowLog: []
    };
    data.products.push(prod);
  } else if (it.thumb && !prod.thumb) {
    prod.thumb = it.thumb;
  }
  const beforeQty = prodStock(prod);
  const totalCost = prod.cost * beforeQty + cost * qty;
  addSizeStock(prod, size, qty);
  prod.cost = Math.round(totalCost / Math.max(1, prodStock(prod)) * 100) / 100;
  if (!prod.flowLog) prod.flowLog = [];
  prod.flowLog.push({ type: '入库', time: D(), note: `采购单入库 ${size}码 ${qty}双 ¥${cost}${shelf ? ' · 货架' + shelf : ''}` });
  if (isDefect(it)) {
    prod.condition = '微瑕';
    prod.flowLog.push({ type: '瑕疵登记', time: D(), note: `采购到货标记：${it.defect}` });
  }
  return { prod, size, cost };
}

function quickReceiveInner(poId, idx, mode) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders || []).find(p => p.id === poId);
  if (!po) return;

  if (remain <= 0) { toast('这件已经全部到货了'); return; }
  const qty = mode === 'all' ? remain : 1;
  const y = window.scrollY;
  const wh = (data.warehouses && data.warehouses[0] && data.warehouses[0].id) || '';
  const inb = {
    id: genId('in'), date: D(), warehouse: wh,

    note: '采购单快速入库 ' + po.id, shelf: '', platform: po.platform,
    device: it.device || po.device || '', purchaseOrderNo: po.id, items: []
  };
  const r = receiveItemIntoStock(data, po, it, qty, it.cost || 0, '');
  it.receivedQty = poItemReceived(it) + qty;
  inb.items.push({ productId: r.prod.id, size: r.size, qty, cost: r.cost });
  data.inboundOrders.push(inb);
  po.status = poHasRemaining(po) ? '部分到货' : '入库完成';

  window.scrollTo(0, y);
  toast(`已入库 ${qty} 双 · ${it.name || '商品'} ${it.size || ''}`.trim());
}

function quickReceiveGroupInner(poId, tracking) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders || []).find(p => p.id === poId);
  if (!po) return;
  const g = poTrackGroups(po).find(x => x.tracking === tracking);

  let total = 0;

    device: [...new Set(po.items.map(x => x.device || po.device || ''))].filter(Boolean).join(' / '),
    purchaseOrderNo: po.id, items: []
  };
  po.items.forEach(it => {
    const remain = (it.qty || 1) - poItemReceived(it);
    if (remain <= 0) return;
    const r = receiveItemIntoStock(data, po, it, remain, it.cost || 0, '');
    it.receivedQty = poItemReceived(it) + remain;
    inb.items.push({ productId: r.prod.id, size: r.size, qty: remain, cost: r.cost });
    n += remain;
  });
  if (n <= 0) { toast('这单已经全部到货了'); return; }
  data.inboundOrders.push(inb);
  po.status = '入库完成';
  if (!saveShoesV2(data)) {
    toast('整单入库未保存：本机存储已满，请清理后重试');
    return;
  }
  poFlashId = poId;
  renderPurchaseOrders();
  poFlashId = '';
  toast(`整单入库 ${n} 双，已完成`);
}

// P1：从一整段快递短信里把单号抠出来
function extractTracking(text) {
  if (!text) return [];
  const out = [];
  const re = /[A-Za-z]{1,4}\d{6,20}|[1-9]\d{9,20}/g;
  let m;
  while ((m = re.exec(text)) !== null) out.push(m[0].toUpperCase());
  return [...new Set(out)];
}
function poMatchSearch(po, key) {
  if (!key) return true;
  const k = key.toLowerCase();
  const hay = [
    po.platform, po.device, po.address, po.note, po.id,
    poTrackings(po).join(' '),
    (po.items || []).map(it => [it.name, it.sku, it.size, it.device, it.address, it.condition, it.tracking].join(' ')).join(' ')
  ].filter(Boolean).join(' ').toLowerCase();
  return hay.indexOf(k) >= 0;
}

// ===== v14：快递单号 ↔ 设备 ↔ 商品 绑定 =====
function poItemTracking(it) { return firstTracking(it); }
// 单号池：整单已录过的所有单号（PO 级 + 商品行级，去重）
function poTrackingPool(po) {
  const set = [];
  const push = t => { const s = (t || '').trim(); if (s && set.indexOf(s) < 0) set.push(s); };
  poTrackings(po).forEach(push);
  (po.items || []).forEach(it => rowTrackings(it).forEach(push));
  return set;
}
// 旧数据迁移：整单只有一个单号时，自动挂到每件商品上，老单子也能按单号分辨
function migratePoTracking(po) {
  const items = po.items || [];
  if (!items.length) return false;
  if (items.some(it => poItemTracking(it))) return false;   // 已经绑过了
  const pool = poTrackingPool(po);
  if (pool.length !== 1) return false;                      // 多个单号无法推断，交给用户分配
  items.forEach(it => { it.trackings = [pool[0]]; it.tracking = pool[0]; });
  return true;
}
// 按单号把商品行分组：未分配单号的放最后
// 取一行的所有单号（新结构 trackings 数组 / 老结构 tracking 字符串）
function rowTrackings(it) {
  if (!it) return [];
  if (Array.isArray(it.trackings) && it.trackings.length) {
    return it.trackings.map(t => String(t || '').trim()).filter(Boolean);
  }
  const old = String(it.tracking || '').trim();
  return old ? [old] : [];
}
// 首单号（兼容老调用）
function firstTracking(it) { return rowTrackings(it)[0] || ''; }

function poTrackGroups(po) {
  const map = {}, order = [];
  (po.items || []).forEach((it, idx) => {
    const list = rowTrackings(it);
    if (!list.length) {
      // 未填单号
      if (!map['']) { map[''] = { tracking: '', rows: [] }; order.push(''); }
      map[''].rows.push({ it, idx });
      return;
    }
    // 一行多个单号 → 出现在每个包裹分组里，方便按包裹查收
    list.forEach(t => {
      if (!map[t]) { map[t] = { tracking: t, rows: [] }; order.push(t); }
      map[t].rows.push({ it, idx });
    });
  });
  order.sort((a, b) => (a === '' ? 1 : 0) - (b === '' ? 1 : 0));
  return order.map(t => map[t]);
}
function poGroupMeta(po, g) {
  const devs = [...new Set(g.rows.map(r => r.it.device || po.device || '未填设备'))];
  const addrs = [...new Set(g.rows.map(r => r.it.address || po.address || '家'))];
  const qty = g.rows.reduce((s, r) => s + (r.it.qty || 1), 0);
  const recv = g.rows.reduce((s, r) => s + poItemReceived(r.it), 0);
  return { devs, addrs, qty, recv, done: recv >= qty };
}

}

function rowTrackings(row) {

function poRemoveRowTracking(gi, ri, k) {

// 正在输入的单号先记在草稿上，防止点了保存却没点＋导致丢失
function poTypingTracking(gi, ri, val) {
  const it = purchaseDraft && purchaseDraft.items && purchaseDraft.items[gi];
  const row = it && it.rows && it.rows[ri];
  if (!row) return;
  const v = String(val || '').trim();
  row._trkDraft = v;
  const base = Array.isArray(row._trkBase) ? row._trkBase.slice() : rowTrackings(row);
  row.trackings = v ? base.concat([v]) : base;   // 边打边生效，不会丢
  row.tracking = row.trackings[0] || '';
}
// 失焦 / 回车 / 保存时把没确认的输入收成正式单号
function poCommitTyping(gi, ri) {
  const it = purchaseDraft && purchaseDraft.items && purchaseDraft.items[gi];
  const row = it && it.rows && it.rows[ri];
  if (!row) return;
  const v = String(row._trkDraft || '').trim();
  row._trkDraft = '';
  if (!v) return;
  const list = rowTrackings(row);
  if (list.indexOf(v) < 0) { list.push(v); setRowTrackings(row, list); }
  poRefreshTrackCell(gi, ri);
}
// 保存前兜底：直接读 DOM，把所有没点的输入都收进来
function commitAllPendingTrackings() {
  if (!purchaseDraft || !purchaseDraft.items) return;
  purchaseDraft.items.forEach((it, gi) => {
    (it.rows || []).forEach((row, ri) => {
      const el = document.getElementById('trkIn_' + gi + '_' + ri);
      const v = el ? String(el.value || '').trim() : '';
      if (!v) { delete row._trkDraft; return; }
      const list = rowTrackings(row);
      if (list.indexOf(v) < 0) { list.push(v); setRowTrackings(row, list); }
      delete row._trkDraft;
    });
  });
}

  const it = purchaseDraft.items[gi];
  if (it && Array.isArray(it.rows)) it.rows.forEach(r => { r.condition = it.condition; });
}
function poApplyAddrToRows(gi) {
  const it = purchaseDraft.items[gi];
  if (it && Array.isArray(it.rows)) it.rows.forEach(r => { r.address = it.address; });
}

// 折叠式采购单卡片：默认只露核心信息，点一下展开明细
function po2CardHtml(po) {
  const u = poUrgency(po);
  const d = poDaysWaited(po);
  const items = po.items || [];
  const qty = items.reduce((s, x) => s + (x.qty || 1), 0);
  const recv = items.reduce((s, x) => s + poItemReceived(x), 0);
  const remain = qty - recv;
  const amt = purchaseAmount(po);
  const devs = [...new Set(items.map(x => x.device || po.device || '未填设备'))];
  const addrs = [...new Set(items.map(x => x.address || po.address || '家'))];
  const brief = items.map(x => `${x.name || x.sku || '商品'}${x.size ? ' ' + x.size : ''}×${x.qty || 1}`).join(' · ');
  const trks = poTrackings(po);
  const expanded = !!poExpanded[po.id];
  const settled = poIsSettled(po);

  const barColor = settled ? 'var(--green)' : (recv > 0 ? '#f59e0b' : 'var(--gray-3)');
  const pct = qty > 0 ? Math.round(recv / qty * 100) : 0;

  let daysHtml = '';
  if (!settled) {
    const cls = u === 'overdue' ? 'red' : (u === 'chase' || u === 'warn' ? 'orange' : '');
    daysHtml = `<div class="po2-days ${cls}">${u === 'overdue' ? '<span class="dot-live"></span> ' : ''}${d > 0 ? d + '天' : '今天'}</div>`;
  }

  const head = `
    <div class="po2-head" onclick="togglePoCard('${po.id}')">
      <div class="po2-main">
        <div class="po2-dev">📱 ${escapeHtml(devs.join(' / '))}
          <span class="tag tag-gray" style="font-weight:400">${escapeHtml(po.platform || '未填')}</span>
          ${poDefectItems(po).length ? `<span class="po-defect-tag">⚠ ${poDefectItems(po).length}</span>` : ''}
        </div>
        <div class="po2-meta">${escapeHtml(brief)}</div>
        <div class="po2-meta" style="color:var(--gray-4)">${recv}/${qty}双 · ¥${amt.toFixed(0)} · ${escapeHtml(addrs.join('/'))}${trks.length ? ' · ' + escapeHtml(trks[0]) + (trks.length > 1 ? '等' + trks.length + '个' : '') : ''}</div>
      </div>
      <div class="po2-right">${daysHtml}<div style="font-size:10px;color:var(--gray-4);margin-top:2px">${expanded ? '收起' : '展开'}</div></div>
    </div>
    <div class="po2-bar"><i style="width:${pct}%;background:${barColor}"></i></div>
  `;

  let quick = '';
  if (!settled) {
    quick = `<div class="po2-quick">
      <button class="q-1" onclick="quickReceiveNext('${po.id}')">+1 双</button>
      <button class="q-all" onclick="quickReceiveWholePO('${po.id}')">整单全到</button>
      <button class="q-more" onclick="showReceiveModal('${po.id}')">改数量 · 入库</button>
    </div>`;
  } else {
    quick = `<div class="po2-quick"><button class="q-more" onclick="viewPurchaseInbound('${po.id}')">查看入库记录</button></div>`;
  }

  let detail = '';
  if (expanded) {
    detail = `<div class="po2-expand">
      ${(() => {
        const k = (poSearchKey || '').toLowerCase();
        const hitNums = poSearchKey ? extractTracking(poSearchKey) : [];
        return poTrackGroups(po).map(g => {
          const m = poGroupMeta(po, g);
          let hit = '';
          if (k && g.tracking && (g.tracking.toLowerCase().indexOf(k) >= 0 || hitNums.some(x => g.tracking.toUpperCase().indexOf(x) >= 0))) hit = ' po2-hit';
          return `<div class="po2-grp${hit}">
            <div class="po2-grp-head">
              <span class="po2-grp-no">${g.tracking ? '📦 ' + escapeHtml(g.tracking) : '📦 未分配单号'}</span>
              <span class="po2-grp-meta">${escapeHtml(m.devs.join('/'))} · ${escapeHtml(m.addrs.join('/'))} · ${m.recv}/${m.qty}双</span>
              ${m.done ? '<span class="tag tag-green">已到齐</span>' : '<span class="tag tag-red">未到齐</span>'}
              ${(!m.done && g.tracking) ? `<button class="qb full" onclick="quickReceiveGroup('${po.id}',${JSON.stringify(g.tracking).replace(/"/g,'&quot;')})">整包到货</button>` : ''}
            </div>
            ${g.rows.map(r => {
              const it = r.it, i = r.idx;
              const rr = poItemReceived(it), q = it.qty || 1, done = rr >= q;
              const dev = it.device || po.device || '';
              const addr = it.address || po.address || '';
              const tkList = rowTrackings(it);
              // 设备/地址/单号 亮色标签，收货时一眼可辨
              const chips = [

                addr ? `<span class="chip chip-addr">🏠 ${escapeHtml(addr)}</span>` : '',

              </div>`;
            }).join('')}
          </div>`;
        }).join('');
      })()}
      ${po.note ? `<div style="font-size:11px;color:var(--gray-4);padding-top:6px">备注：${escapeHtml(po.note)}</div>` : ''}
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="editPurchaseOrder('${po.id}')">编辑</button>
        <button class="btn btn-outline btn-sm" onclick="showFillTrackingModal('${po.id}')">${trks.length ? '改单号' : '填单号'}</button>
        ${po.status === '运输中' ? `<button class="btn btn-outline btn-sm" onclick="markUnshipped('${po.id}')">改未发货</button>` : ''}
        ${po.status === '待发货' ? `<button class="btn btn-outline btn-sm" onclick="markShipped('${po.id}')">标记已发货</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="deletePurchaseOrder('${po.id}')" style="color:var(--red)">删除</button>
      </div>
    </div>`;
  }

  const anim = poFlashId === po.id ? ' po2-in' : '';
  return `<div class="po2 u-${u}${anim}" id="pocard_${po.id}">${head}${quick}${detail}</div>`;
}

function quickReceiveNext(poId) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders || []).find(p => p.id === poId);
  if (!po) return;
  const idx = (po.items || []).findIndex(it => poItemReceived(it) < (it.qty || 1));
  if (idx < 0) { toast('这单已经全部到货了'); return; }
  quickReceive(poId, idx, 1);
}

function renderPurchaseOrders() {
  const data = loadShoesV2();
  const allPOs = data.purchaseOrders || [];
  // 旧单子惰性迁移：整单只有一个单号时自动挂到每件商品上
  let _mig = false;
  allPOs.forEach(po => { if (migratePoTracking(po)) _mig = true; });
  if (_mig) saveShoesV2(data);
  const stats = calcPurchaseStats(allPOs);
  const transit = poTransitStats(allPOs);
  const defectTotal = poDefectCount(allPOs);
  const todayKey = D();

  const todayInQty = (data.inboundOrders || [])
    .filter(o => o.date === todayKey)
    .reduce((s, o) => s + (o.items || []).reduce((a, b) => a + (b.qty || 0), 0), 0);

  const isTodo = poView === 'todo';
  const key = poSearchKey;

  // ---- 过滤 + 排序 ----
  let list;
  if (key) {
    list = allPOs.filter(po => poMatchSearch(po, key));
    // 粘贴一整段快递短信时，自动按单号命中
    const nums = extractTracking(key);
    if (nums.length) {
      const hit = allPOs.filter(po => poTrackingPool(po).some(t => nums.some(n => t.toUpperCase().indexOf(n) >= 0)));
      if (hit.length) list = hit;
    }
  } else if (isTodo) {
    list = allPOs.filter(po => !poIsSettled(po));
  } else {
    if (purchaseFilter === '待发货') list = allPOs.filter(po => po.status === '待发货');
    else if (purchaseFilter === '待收货') list = allPOs.filter(po => po.status === '运输中');
    else if (purchaseFilter === '部分到货') list = allPOs.filter(po => po.status === '部分到货');
    else if (purchaseFilter === '已入库完结') list = allPOs.filter(po => po.status === '入库完成');
    else if (purchaseFilter === '瑕疵') list = allPOs.filter(po => poDefectItems(po).length > 0);
    else list = allPOs.slice();
  }
  if (key) list.forEach(po => { poExpanded[po.id] = true; });
  if (isTodo || key) {
    list.sort((a, b) => {
      const ua = poUrgency(a) === 'done' ? 1 : 0, ub = poUrgency(b) === 'done' ? 1 : 0;
      if (ua !== ub) return ua - ub;
      return poDaysWaited(b) - poDaysWaited(a);

      </div>

  const tPct = transit.total > 0 ? Math.round(transit.stored / transit.total * 100) : 0;

        <div class="n">${todayInQty}</div><div class="t">今日已入库</div>

    ${transitBlock}

    ${isTodo && !key ? '' : statsBlock}

    <div id="poList">
      ${list.length === 0
        ? `<div class="empty-state"><div class="empty-icon">${isTodo && !key ? '✅' : '📋'}</div>${key ? '没搜到匹配的采购单' : (isTodo ? '所有货都到了，没有在途采购' : '暂无采购单')}</div>`

function deletePurchaseOrder(poId) {
  if (!confirm('确定删除这个采购单？已入库的库存不会退回。')) return;
  const data = loadShoesV2();
  const i = (data.purchaseOrders || []).findIndex(p => p.id === poId);
  if (i < 0) return;
  data.purchaseOrders.splice(i, 1);
  saveShoesV2(data);
  renderPurchaseOrders();
  toast('采购单已删除');
}

function editPurchaseOrder(poId) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders||[]).find(p => p.id === poId);
  if (!po) return;
  if (po.status === '入库完成') { toast('已入库的采购单不可编辑'); return; }
  editingPurchaseId = poId;
  purchaseDraft = JSON.parse(JSON.stringify(po));
  purchaseDraft.tracking = poTrackings(po);
  purchaseDraft.address = po.address || '家';
  purchaseDraft.device = po.device || '';
  // 迁移：扁平 items → 按 groupId 聚合成「商品 + 子条目」
  purchaseDraft.items = groupFlatItemsToDraft(po.items || [], po);
  renderPurchaseModal();
}

// 扁平 items → 商品卡片草稿（同 groupId 归为一张卡；无 groupId 的同名同图合并）
function groupFlatItemsToDraft(items, po) {
  const order = [];
  const map = {};
  items.forEach((it, idx) => {
    const key = it.groupId
      || (it.name || '') + '¦' + (it.thumb ? String(it.thumb).slice(-24) : '')
      || ('solo_' + idx);
    if (!map[key]) {
      map[key] = {
        groupId: it.groupId || ('g_mig_' + key),
        name: it.name || '', condition: it.condition || '全新',
        thumb: it.thumb || null,
        device: it.device || po.device || '',
        address: it.address || po.address || '家',
        rows: []
      };
      order.push(map[key]);
    }
    const g = map[key];
    if (!g.thumb && it.thumb) g.thumb = it.thumb;
    g.rows.push({
      device: it.device || po.device || '',
      address: it.address || po.address || '家',
      size: it.size || '', color: it.color || '',
      qty: it.qty || 1, cost: it.cost || 0,
      trackings: rowTrackings(it),
      tracking: firstTracking(it),
      receivedQty: it.receivedQty || 0,
      defect: it.defect || '无'
    });
  });
  return order;
}

// ===== 历史商品库：采购过/库存里的商品，直接选用不用重新输 =====
function getPurchaseHistory() {
  const map = {};
  const push = (key, obj) => { if (key && !map[key]) map[key] = obj; };
  try {
    const data = loadShoesV2();
    (data.products || []).forEach(p => {
      const key = (p.name || p.sku || '').trim();
      push(key, { name: key, cost: p.cost || 0, size: (p.sizes && p.sizes[0] && p.sizes[0].size) || '', condition: p.condition || '全新', thumb: p.thumb || null });
    });
    (data.purchaseOrders || []).forEach(po => (po.items || []).forEach(it => {
      const key = (it.name || it.sku || '').trim();
      push(key, { name: key, cost: it.cost || 0, size: it.size || '', condition: it.condition || '全新', thumb: it.thumb || null });
    }));
  } catch (e) {}
  return Object.values(map).reverse();   // 最近采购的排前面
}
let historyTargetIdx = null;
function showPurchaseHistory(idx) {
  historyTargetIdx = idx;
  document.getElementById('modalContent').innerHTML = `
    <h3>选择历史商品</h3>
    <input type="text" class="input" id="phSearch" placeholder="搜索货号/名称" style="margin-bottom:10px" oninput="renderPurchaseHistoryList()">

    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button></div>`;
  renderPurchaseHistoryList();
  document.getElementById('modalOverlay').classList.add('show');
}
function renderPurchaseHistoryList() {
  const q = ((document.getElementById('phSearch') || {}).value || '').trim().toLowerCase();
  const list = getPurchaseHistory().filter(x => !q || x.name.toLowerCase().includes(q));
  window.__phList = list;

    list.map((x, i) => `<div class="ph-item" onclick="applyHistoryItemAt(${i})">

      <div style="flex:1;min-width:0">

      </div>
      <span style="font-size:16px;color:var(--blue)">＋</span>

}
function applyHistoryItemAt(i) {
  const h = (window.__phList || [])[i];
  if (!h || historyTargetIdx == null || !purchaseDraft) return;
  const it = purchaseDraft.items[historyTargetIdx];
  if (!it) return;
  it.name = h.name;
  it.condition = h.condition || it.condition || '全新';
  if (h.thumb && !it.thumb) {
    it.thumb = h.thumb;
    if (Array.isArray(it.rows)) it.rows.forEach(r => { r.thumb = h.thumb; });
  }
  // 成本/尺码带到第一行明细上
  if (Array.isArray(it.rows) && it.rows.length) {
    if (h.cost) it.rows[0].cost = h.cost;
    if (h.size) it.rows[0].size = h.size;
  }
  window.__phList = null;
  historyTargetIdx = null;
  closeModal();
  renderPurchaseModal();
  toast('已带出历史商品信息');
}
function addPurchaseItem() {

function uploadPurchaseImg(input, itemIndex) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = function() { toast('图片读取失败，请换一张试试'); };
  reader.onload = function(e) {
    const img = new Image();
    img.onerror = function() { toast('图片格式不支持，请换一张试试'); };
    img.onload = function() {
      try {
        const canvas = document.createElement('canvas');
        const maxW = 240;                 // 压到 240px，约为原尺寸的 1/3 体积
        const scale = Math.min(maxW / img.width, maxW / img.height, 1);
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const thumb = canvas.toDataURL('image/jpeg', 0.6);
        purchaseDraft.items[itemIndex].thumb = thumb;
        // 图片属于该商品，同步到其所有子条目，收货入库时跟着走
        if (Array.isArray(purchaseDraft.items[itemIndex].rows)) {
          purchaseDraft.items[itemIndex].rows.forEach(r => { r.thumb = thumb; });
        }
        renderPurchaseModal();
        toast('图片已添加');
      } catch (err) {
        toast('图片处理失败：' + (err && err.message ? err.message : '未知错误'));
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 校验采购草稿：每个商品至少要有一行有效明细
function validatePurchaseDraft() {
  for (let i = 0; i < purchaseDraft.items.length; i++) {
    const it = purchaseDraft.items[i];
    const rows = Array.isArray(it.rows) ? it.rows : [];
    if (!rows.length) {
      toast('第 ' + (i + 1) + ' 个商品还没添加明细，点「＋ 加一台设备」');
      return false;
    }
    for (let j = 0; j < rows.length; j++) {
      const r = rows[j];
      if (!(r.qty > 0)) {
        toast('「' + (it.name || '商品') + '」第 ' + (j + 1) + ' 行数量需大于 0');
        return false;
      }
    }
  }
  return true;
}

// 把「商品 + 子条目」的草稿展开成扁平 items（下游到货/入库/单号逻辑全部复用）
function flattenDraftItems() {
  const flat = [];
  (purchaseDraft.items || []).forEach((it, gi) => {
    const groupId = it.groupId || it.id || ('g_' + gi + '_' + Date.now());
    it.groupId = groupId;
    const rows = Array.isArray(it.rows) ? it.rows : [];
    rows.forEach((r, ri) => {
      const qty = Math.max(1, parseInt(r.qty) || 1);
      const recv = Math.max(0, Math.min(parseInt(r.receivedQty) || 0, qty));
      flat.push({
        id: r.id || genId('pi'),
        groupId: groupId,                        // 同一商品的分组标识
        name: it.name || '',
        thumb: it.thumb || r.thumb || null,
        size: (r.size || '').trim(),
        color: (r.color || '').trim(),
        condition: it.condition || '全新',
        cost: parseFloat(r.cost) || 0,
        qty: qty,
        device: r.device || it.device || purchaseDraft.device || '',
        address: r.address || it.address || purchaseDraft.address || '家',
        trackings: rowTrackings(r),
        tracking: firstTracking(r),
        receivedQty: recv,
        defect: r.defect || '无',
      });
    });
  });
  return flat;
}

function savePurchaseOrder() {
  if (!purchaseDraft) return;
  commitAllPendingTrackings();      // 输入了但没点＋的单号也要保存
  if (purchaseDraft.items.length === 0) { toast('请添加至少一件商品'); return; }
  if (!validatePurchaseDraft()) return;

  const flatItems = flattenDraftItems();
  if (!flatItems.length) { toast('请至少填写一行商品明细'); return; }

  const data = loadShoesV2();
  // 记住用过的设备，供下次下拉建议
  const devBook = getDeviceBook();
  [purchaseDraft.device].concat(flatItems.map(it => it.device)).forEach(d => {
    if (d && !devBook.includes(d)) devBook.push(d);
  });
  saveDeviceBook(devBook);
  if (editingPurchaseId) {
    const idx = data.purchaseOrders.findIndex(p => p.id === editingPurchaseId);
    if (idx >= 0) {
      const merged = { ...data.purchaseOrders[idx], ...purchaseDraft, items: flatItems };
      delete merged.rows;
      data.purchaseOrders[idx] = merged;
    }
  } else {
    const po = {
      id: genId('po'),
      platform: purchaseDraft.platform,
      date: purchaseDraft.date,
      device: purchaseDraft.device,
      items: flatItems,
      shippingFee: purchaseDraft.shippingFee,
      tracking: Array.isArray(purchaseDraft.tracking) ? purchaseDraft.tracking : (purchaseDraft.tracking ? [purchaseDraft.tracking] : []),
      address: purchaseDraft.address || '家',
      note: purchaseDraft.note,
      status: (Array.isArray(purchaseDraft.tracking) ? purchaseDraft.tracking.length : (purchaseDraft.tracking ? 1 : 0)) ? '运输中' : '待发货',
    };
    data.purchaseOrders.push(po);
  }
  if (!saveShoesV2(data)) {
    // 保存失败（多为存储满）：不要关闭弹窗，让用户能看到数据还在、可重试
    return;
  }
  closeModal();
  renderPurchaseOrders();
  toast(editingPurchaseId ? '采购单已更新' : '采购单已创建');
}

// 给某一件商品绑定单号
function setPoItemTracking(poId, idx, val) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders||[]).find(p => p.id === poId);
  if (!po || !po.items[idx]) return;
  if (val === '__new__') {
    const t = prompt('输入新的快递单号');
    if (!t || !t.trim()) { showFillTrackingModal(poId); return; }
    val = t.trim();
  }
  po.items[idx].trackings = val ? [val] : [];
  po.items[idx].tracking = val;
  saveShoesV2(data);
  showFillTrackingModal(poId);
  renderPurchaseOrders();
  if (val) toast('已绑定 ' + val);

// 同设备 + 同地址的货自动归到同一个单号
function autoAssignTrackingByDevice(poId) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders||[]).find(p => p.id === poId);
  if (!po) return;
  const keys = [];
  (po.items||[]).forEach(it => {
    const k = (it.device||po.device||'') + '||' + (it.address||po.address||'');
    if (keys.indexOf(k) < 0) keys.push(k);
  });
  const pool = poTrackingPool(po);
  const map = {};
  keys.forEach((k,i) => { map[k] = pool[i] || ''; });
  (po.items||[]).forEach(it => {
    const k = (it.device||po.device||'') + '||' + (it.address||po.address||'');
    it.trackings = map[k] ? [map[k]] : [];
    it.tracking = map[k];
  });
  saveShoesV2(data);
  renderPurchaseOrders();
  showFillTrackingModal(poId);
  toast(pool.length ? '已按设备+地址分配单号' : '还没有单号，先把单号加进单号池');
}

// 按值删除单号：单号池和所有商品行上挂的都清掉
function removeTrackingNumber(poId, idx) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders||[]).find(p => p.id === poId);
  if (!po) return;
  const t = poTrackingPool(po)[idx];
  if (!t) return;
  po.tracking = poTrackings(po).filter(x => x !== t);
  (po.items||[]).forEach(it => {
    const list = rowTrackings(it).filter(x => x !== t);
    it.trackings = list; it.tracking = list[0] || '';
  });
  saveShoesV2(data);
  showFillTrackingModal(poId);
  renderPurchaseOrders();
}

function confirmReceiveInner(poId) {
  const data = loadShoesV2();
  const po = (data.purchaseOrders||[]).find(p => p.id === poId);
  if (!po) return;
  // 元素取不到时给兜底值，避免空指针中断整条入库流程（否则数据不保存、界面卡住）
  const valOf = (id, def) => {
    const el = document.getElementById(id);
    return el ? el.value : def;
  };
  const shippingFee = parseFloat(valOf('recvShippingFee', po.shippingFee || 0)) || 0;
  const shelf = String(valOf('recvShelf', '')).trim();
  const orderId = genId('in');
  const devSet = [...new Set(po.items.map(it=>it.device||po.device||'').filter(Boolean))].join(' / ');
  const inboundOrder = {
    id: orderId, date: D(), warehouse: data.warehouses[0].id,
    tracking: poTrackings(po).join(' / ') || '', shippingFee: shippingFee, otherFee: 0,
    note: '采购单入库 ' + po.id, shelf: shelf, platform: po.platform, device: devSet,
    purchaseOrderNo: po.id, items: []
  };
  let receivedAny = 0;
  po.items.forEach((it,i) => {
    const costEl = document.getElementById('recvCost_'+i);
    const qtyEl = document.getElementById('recvQty_'+i);
    if (!qtyEl) return;                       // 已全部到货的商品不再入库
    const cost = parseFloat(costEl && costEl.value) || 0;
    const priceEl = document.getElementById('recvPrice_' + i);
    const marketPrice = priceEl ? (parseFloat(priceEl.value) || 0) : 0;
    let qty = parseInt(qtyEl.value);
    if (isNaN(qty) || qty < 0) qty = 0;
    const remain = Math.max(0, (it.qty||1) - poItemReceived(it));
    qty = Math.min(qty, remain);
    if (qty <= 0) return;                     // 本次没到货的跳过
    const size = (it.size && String(it.size).trim()) || '均码';
    let prod = getProductBySku(data, it.sku || it.name);
    if (!prod) {
      prod = {
        id: genId('p'), sku: it.sku||it.name||'', name: it.name||it.sku||'商品', brand: '',
        sizes: [], condition: it.condition||'全新', cost: 0, price: 0,
        status: '正常可售', shelf: shelf, platform: po.platform, device: it.device||po.device||'',
        purchaseOrderNo: po.id, thumb: it.thumb||null, flowLog: []
      };
      data.products.push(prod);
    } else {
      if (it.thumb && !prod.thumb) prod.thumb = it.thumb;
    }
    if (marketPrice > 0) prod.price = marketPrice;
    const beforeQty = prodStock(prod);
    const totalCost = prod.cost * beforeQty + cost * qty;
    addSizeStock(prod, size, qty);
    prod.cost = Math.round(totalCost / Math.max(1, prodStock(prod)) * 100) / 100;
    if (!prod.flowLog) prod.flowLog = [];
    prod.flowLog.push({type:'入库', time: D(), note: `采购单入库 ${size}码 ${qty}双 ¥${cost}${shelf?' · 货架'+shelf:''}`});
    // 瑕疵标记同步到库存商品，长期高亮提醒
    if (isDefect(it)) {
      prod.condition = '微瑕';
      prod.flowLog.push({type:'瑕疵登记', time: D(), note: `采购到货标记：${it.defect}`});
    }
    it.receivedQty = poItemReceived(it) + qty;
    receivedAny += qty;
    inboundOrder.items.push({ productId: prod.id, size, qty, cost });
  });
  if (receivedAny > 0) data.inboundOrders.push(inboundOrder);
  po.status = poHasRemaining(po) ? '部分到货' : '入库完成';
  const saved = saveShoesV2(data);
  closeModal();
  if (!saved) {
    // 保存失败（多半是存储满）：明确告知，不要静默失败让用户以为卡住
    toast('入库未保存：本机存储已满，请清理后重试');
    return;
  }
  renderPurchaseOrders();
  toast(receivedAny > 0
    ? (poHasRemaining(po) ? `已入库 ${receivedAny} 双，仍有未到货，已标记部分到货` : `入库成功，本单已全部到货`)
    : '本次未填写到货数量');
}

// 页面4: 商品库存列表
let batchPricingOn = false;        // 批量估价模式开关
let inventoryFilter = 'all';       // all=在库(隐藏零库存) / 在售 / 微瑕 / 已售出(零库存)
let inventorySort = 'profitDesc';  // 默认按利润降序排行
let invSearchTerm = '';
// 有效利润：在库用预估利润，已售用实际售出利润，便于统一排行
function effectiveProfit(p, data) {
  data = data || loadShoesV2();
  return prodStock(p) > 0 ? calcProductEstimatedProfit(p) : calcProductProfit(p.id, data);
}
function sortInventory(products, data) {
  const sink = (a, b) => (isUnvalued(a) === isUnvalued(b)) ? 0 : (isUnvalued(a) ? 1 : -1); // 待估价永远沉底
  if (inventorySort === 'profitDesc') products.sort((a,b)=> sink(a,b) || effectiveProfit(b,data)-effectiveProfit(a,data));
  else if (inventorySort === 'profitAsc') products.sort((a,b)=> sink(a,b) || effectiveProfit(a,data)-effectiveProfit(b,data));
  else if (inventorySort === 'stockDesc') products.sort((a,b)=> prodStock(b)-prodStock(a));
  else if (inventorySort === 'stockAsc') products.sort((a,b)=> prodStock(a)-prodStock(b));
  else if (inventorySort === 'unitDesc') products.sort((a,b)=> sink(a,b) || calcProductUnitProfit(b)-calcProductUnitProfit(a));
  else if (inventorySort === 'unitAsc') products.sort((a,b)=> sink(a,b) || calcProductUnitProfit(a)-calcProductUnitProfit(b));
  return products;
}
function getStatusTag(p, data) {
  const def = data.defects.find(d=>d.productId===p.id && d.status!=='处理完成');
  if (def) {
    if (def.status === '未修复') return '<span class="tag tag-red">瑕疵-待修复</span>';
    if (def.status === '已修复') return '<span class="tag tag-green">瑕疵-已修复</span>';
    if (def.status === '待闲鱼出售' || def.status === '待换货') return '<span class="tag tag-orange">瑕疵-待处理</span>';
  }
  if (prodStock(p) <= 0) return '<span class="tag tag-gray">已售出</span>';
  if (p.status && p.status !== '正常可售') return '<span class="tag tag-orange">' + escapeHtml(p.status) + '</span>';
  return ''; // 正常可售不挂标签，异常才喊
}

// 渲染单个商品卡片的盈亏 HTML（库存>0 显示预估利润，否则显示售出利润）
function invProfitHtml(p, data) {
  const stock = prodStock(p);
  if (stock > 0) {
    if (isUnvalued(p)) return '<span style="font-size:10px;color:#b45309">未估价</span>';
    const est = calcProductEstimatedProfit(p);
    return `<span class="pprofit ${est>=0?'green':'red'}"><span class="plabel">预估</span>${est>=0?'+':''}¥${est.toFixed(0)}</span>`;
  }
  const sold = calcProductProfit(p.id, data);
  return `<span class="pprofit ${sold>=0?'green':'red'}"><span class="plabel">售出</span>${sold>=0?'+':''}¥${sold.toFixed(0)}</span>`;
}
function urgentTagHtml(p) {
  return p.urgent ? '<span class="tag tag-red urgent-tag">急售</span>' : '';
}
function unitProfitTagHtml(p) {
  if (isUnvalued(p) && prodStock(p) > 0) return `<span class="tag tag-unvalued" onclick="event.stopPropagation();promptSetPrice('${p.id}')">待估价·点此填价</span>`;
  const up = calcProductUnitProfit(p);

  if (up > 70) return `<span class="tag up-lv2">单利¥${up.toFixed(0)}</span>`;

  return `<span class="tag tag-gray">单利¥${up.toFixed(0)}</span>`;
}

  const data = loadShoesV2();

function filterInventory() {
  const q = (invSearchTerm || '').toLowerCase().trim();
  const data = loadShoesV2();
  batchPricingOn = false;
  let products = data.products;
  if (inventoryFilter === '在售') products = products.filter(p=>p.status==='正常可售' && prodStock(p)>0);
  else if (inventoryFilter === '微瑕') products = products.filter(p => data.defects.some(d=>d.productId===p.id && d.status!=='处理完成'));
  else if (inventoryFilter === '已售出') products = products.filter(p=>prodStock(p)<=0);
  else if (inventoryFilter === '待估价') products = products.filter(p=>prodStock(p)>0 && isUnvalued(p));
  else products = products.filter(p=>prodStock(p)>0);
  if (q) products = products.filter(p => p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q));
  products = sortInventory(products, data);
  document.getElementById('invList').innerHTML = products.length === 0 ? '<div class="empty-state">暂无商品</div>' :
    products.map(p => invCardHtml(p, data)).join('');
  initInvSwipe();
}

// 库存列表左滑删除手势（仿每日行程任务滑动）
let invOpenRow = null;
window.invSwipeSuppressClick = false;

function initInvSwipe() {
  const container = document.getElementById('invList');
  if (!container || container.dataset.invSwipeBound === '1') return;
  container.dataset.invSwipeBound = '1';
  const sel = '.inv-swipe-item';
  const AW = 160; // 已入仓 + 删除 两按钮宽度
  let item = null, front = null, startX = 0, startY = 0, mode = null, pid = null;

  container.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (isTouch && e.clientX < 28) return;
    const t = e.target.closest(sel);
    if (!t) return;
    if (e.target.closest('.pi-actions') || e.target.closest('.pi-del-btn')) return;
    item = t; front = t.querySelector('.pi-front');
    if (!front) return;
    startX = e.clientX; startY = e.clientY; mode = null; pid = e.pointerId;
    try { front.setPointerCapture(pid); } catch (_) {}
    if (invOpenRow && invOpenRow !== item) closeInvRow(invOpenRow);
  });

  container.addEventListener('pointermove', (e) => {
    if (!item || !front) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (mode === 'swipe') {
      front.style.transform = `translateX(${Math.max(-AW, Math.min(0, dx))}px)`;
      e.preventDefault();
      return;
    }
    if (Math.hypot(dx, dy) <= 8) return;
    if (Math.abs(dx) > Math.abs(dy) && dx < 0) {
      mode = 'swipe';
      front.style.transition = 'none';
      item.classList.add('swiping');
      e.preventDefault();
    } else {
      item = null; front = null;
    }
  });

  container.addEventListener('pointerup', (e) => {
    if (!item || !front) return;
    if (mode === 'swipe') {
      const dx = e.clientX - startX;
      front.style.transition = 'transform 0.25s var(--ease)';
      item.classList.remove('swiping');
      if (dx <= -AW * 0.45) {
        item.classList.add('open');
        invOpenRow = item;
        front.style.transform = `translateX(${-AW}px)`;
      } else {
        closeInvRow(item);
      }
      window.invSwipeSuppressClick = true;
      setTimeout(() => { window.invSwipeSuppressClick = false; }, 80);
    }
    try { front.releasePointerCapture(pid); } catch (_) {}
    item = null; front = null; mode = null;
  });

  container.addEventListener('pointercancel', () => {
    if (item && front) closeInvRow(item);
    item = null; front = null; mode = null;
  });

  // 点击其他卡片或空白处关闭已打开的行
  container.addEventListener('click', (e) => {
    if (invOpenRow && !e.target.closest(sel)) closeInvRow(invOpenRow);
  });
}

function closeInvRow(el) {

}

// 页面5: 销售台账
let ledgerPeriod = 'day';
function renderShoesLedger() {
  const data = loadShoesV2();
  let startDate;
  if (ledgerPeriod === 'day') startDate = D();
  else if (ledgerPeriod === 'week') {
    const d = new Date(currentDate); d.setDate(d.getDate()-6); startDate = getDateKey(d);
  } else {
    const d = new Date(currentDate); d.setDate(d.getDate()-29); startDate = getDateKey(d);
  }

  const periodOut = data.outboundOrders.filter(o => o.date >= startDate);
  const orderCount = periodOut.length;
  const totalIncome = periodOut.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+i.price*i.qty,0),0);
  const totalCost = periodOut.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.cost||0)*i.qty,0),0);
  const totalShip = periodOut.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.shippingFee||0)*i.qty,0),0);
  const totalOther = periodOut.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.otherFee||0)*i.qty,0),0);
  const totalRepair = data.defects.reduce((s,d)=>s+(d.repairCost||0),0);
  const netProfit = totalIncome - totalCost - totalShip - totalOther - totalRepair;

  document.getElementById('shoesTabContent').innerHTML = `
    <div class="pill-group">
      <div class="pill ${ledgerPeriod==='day'?'active':''}" onclick="ledgerPeriod='day';renderShoesLedger()">日</div>
      <div class="pill ${ledgerPeriod==='week'?'active':''}" onclick="ledgerPeriod='week';renderShoesLedger()">周</div>
      <div class="pill ${ledgerPeriod==='month'?'active':''}" onclick="ledgerPeriod='month';renderShoesLedger()">月</div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px">汇总</div>
      <div class="info-grid" style="grid-template-columns:1fr 1fr;gap:6px">
        <div class="ig-item"><div class="ig-label">成交单数</div><div class="ig-value">${orderCount}</div></div>
        <div class="ig-item"><div class="ig-label">总收入</div><div class="ig-value">¥${totalIncome.toFixed(0)}</div></div>
        <div class="ig-item"><div class="ig-label">总成本</div><div class="ig-value">¥${totalCost.toFixed(0)}</div></div>
        <div class="ig-item"><div class="ig-label">发货运费</div><div class="ig-value">¥${totalShip.toFixed(0)}</div></div>
        <div class="ig-item"><div class="ig-label">其他杂费</div><div class="ig-value">¥${totalOther.toFixed(0)}</div></div>
        <div class="ig-item"><div class="ig-label">维修成本</div><div class="ig-value">¥${totalRepair.toFixed(0)}</div></div>
      </div>
      <div style="text-align:right;margin-top:10px;font-size:18px;font-weight:700;color:${netProfit>=0?'var(--green)':'var(--red)'}">
        净利润: ${netProfit>=0?'+':''}¥${netProfit.toFixed(0)}
      </div>
    </div>
    <div style="font-size:15px;font-weight:600;padding:8px 0">流水明细</div>
    <div id="ledgerList">
      ${periodOut.length === 0 ? '<div class="empty-state">暂无出库记录</div>' :
        periodOut.map(o => {
          // 找到关联的入库单（采购单号、平台、设备）
          const inOrder = data.inboundOrders.find(io => io.items.some(iit => iit.productId === (o.items[0]||{}).productId));
          const purchaseNo = inOrder && inOrder.purchaseOrderNo ? inOrder.purchaseOrderNo : '-';
          const platform = inOrder && inOrder.platform ? inOrder.platform : '-';
          const device = inOrder && inOrder.device ? inOrder.device : '-';
          const shelf = inOrder && inOrder.shelf ? inOrder.shelf : (o.shelf || '-');
          const defectNote = o.note && o.note.indexOf('瑕疵') >= 0 ? o.note : '';
          return o.items.map(it => {
            const prod = data.products.find(p=>p.id===it.productId);
            const name = prod ? prod.name : '已删除商品';
            const size = prod ? sizeLabel(prod) : '-';
            const shipFee = it.shippingFee||0;
            const otherFee = it.otherFee||0;
            const profit = it.profit !== undefined ? it.profit * it.qty : (it.price - (it.cost||0) - shipFee - otherFee) * it.qty;
            return `<div class="ledger-item">
              <div style="width:32px;height:32px;border-radius:6px;flex-shrink:0;margin-right:6px">${prod && prod.thumb ? `<img src="${prod.thumb}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">` : '<div style="width:100%;height:100%;background:var(--gray-1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px">👟</div>'}</div>

function exportLedger() {
  const data = loadShoesV2();
  let csv = '\uFEFF日期,货品,尺码,数量,卖价,货品成本,发货运费,其他杂费,维修成本,瑕疵处理备注,采购单号,下单平台,下单设备,货架,利润\n';
  data.outboundOrders.forEach(o => {
    const inOrder = data.inboundOrders.find(io => io.items.some(iit => iit.productId === (o.items[0]||{}).productId));
    const purchaseNo = inOrder && inOrder.purchaseOrderNo ? inOrder.purchaseOrderNo : '-';
    const platform = inOrder && inOrder.platform ? inOrder.platform : '-';
    const device = inOrder && inOrder.device ? inOrder.device : '-';
    const shelf = inOrder && inOrder.shelf ? inOrder.shelf : (o.shelf || '-');
    const defectNote = o.note && o.note.indexOf('瑕疵') >= 0 ? o.note : '';
    o.items.forEach(it => {
      const prod = data.products.find(p=>p.id===it.productId);
      const name = prod ? prod.name : '-';
      const size = prod ? sizeLabel(prod) : '-';
      const shipFee = it.shippingFee||0;
      const otherFee = it.otherFee||0;
      const repairCost = data.defects.filter(d=>d.productId===it.productId).reduce((s,d)=>s+(d.repairCost||0),0);
      const profit = it.profit !== undefined ? it.profit * it.qty : (it.price - (it.cost||0) - shipFee - otherFee) * it.qty;
      csv += `${o.date},${name},${size},${it.qty},${it.price},${it.cost||0},${shipFee},${otherFee},${repairCost},${defectNote},${purchaseNo},${platform},${device},${shelf},${profit.toFixed(1)}\n`;
    });
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `球鞋台账_${D()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

// 在商品详情页编辑并保存字段
function updateProductField(pid, field, value) {
  const data = loadShoesV2();
  const prod = data.products.find(p => p.id === pid);
  if (!prod) return;
  if (field === 'cost' || field === 'price') {
    const n = parseFloat(value);
    prod[field] = isNaN(n) ? 0 : n;
  } else {
    prod[field] = (value || '').trim();
  }
  saveShoesV2(data);
  showProductDetail(pid);
  toast('已保存');
}

// 编辑商品尺码子规格
function updateProductSize(pid, sid, field, value) {
  const data = loadShoesV2();
  const prod = data.products.find(p => p.id === pid);
  if (!prod) return;
  const s = (prod.sizes || []).find(x => x.id === sid);
  if (!s) return;
  if (field === 'size') {
    s.size = (value || '').trim();
  } else if (field === 'stock') {
    const n = parseInt(value, 10);
    s.stock = isNaN(n) ? 0 : Math.max(0, n);
  }
  saveShoesV2(data);
  showProductDetail(pid);
  renderShoesInventory();
  toast('尺码已更新');
}
function addProductSize(pid) {
  const data = loadShoesV2();
  const prod = data.products.find(p => p.id === pid);
  if (!prod) return;
  if (!prod.sizes) prod.sizes = [];
  prod.sizes.push({ id: genId('size'), size: '新尺码', stock: 0 });
  saveShoesV2(data);
  showProductDetail(pid);
  renderShoesInventory();
  toast('已添加尺码');
}
function removeProductSize(pid, sid) {
  if (!confirm('确定删除该尺码子规格？')) return;
  const data = loadShoesV2();
  const prod = data.products.find(p => p.id === pid);
  if (!prod) return;
  prod.sizes = (prod.sizes || []).filter(x => x.id !== sid);
  saveShoesV2(data);
  showProductDetail(pid);
  renderShoesInventory();
  toast('已删除尺码');
}

function exportFlowLog(pid) {
  const data = loadShoesV2();
  const prod = data.products.find(p => p.id === pid);
  if (!prod) return;
  const inOrder = data.inboundOrders.find(o => o.items.some(i => i.productId === pid));
  const outOrder = data.outboundOrders.find(o => o.items.some(i => i.productId === pid));
  let csv = '\uFEFF类型,时间,详情\n';
  if (inOrder) csv += `采购入库,${inOrder.date},平台:${inOrder.platform||'-'} 设备:${inOrder.device||'-'} 采购单号:${inOrder.purchaseOrderNo||'-'} 货架:${inOrder.shelf||'-'}\n`;
  if (prod.flowLog) {
    prod.flowLog.forEach(log => {
      csv += `${log.type},${log.time},${log.note||''}\n`;
    });
  }
  if (outOrder) {
    const it = outOrder.items.find(i => i.productId === pid);
    csv += `出库销售,${outOrder.date},卖出价¥${it.price} 成本¥${it.cost||0} 运费¥${it.shippingFee||0} 杂费¥${it.otherFee||0} 净利润¥${(it.profit||0)*it.qty}\n`;
  }
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `流转记录_${prod.name}_${D()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

  if (!size) { toast('请填写尺码'); return; }
  const prod = data.products.find(p=>p.id===pid);
  const beforeQty = prodStock(prod);
  const totalCost = prod.cost * beforeQty + cost * qty;
  addSizeStock(prod, size, qty);
  prod.cost = Math.round(totalCost / Math.max(1, prodStock(prod)) * 100) / 100;
  prod.flowLog.push({type:'入库', time:D(), note:`补货 ${size}码 ${qty}双 ¥${cost}`});

  // 创建入库单
  data.inboundOrders.push({
    id: genId('in'), date: D(), warehouse: data.warehouses[0].id, tracking:'', shippingFee:0, otherFee:0, note:'快速入库',
    shelf: prod.shelf||'', platform:'', device:'', purchaseOrderNo:'',
    items:[{productId:pid, size, qty, cost}]
  });
  saveShoesV2(data);
  closeModal();
  showProductDetail(pid);
  toast('入库成功');
}

function quickSell(pid) {
  const data = loadShoesV2();
  const prod = data.products.find(p=>p.id===pid);
  if (prodStock(prod) <= 0) { toast('库存不足'); return; }
  const sizesHtml = (prod.sizes||[]).filter(s=>(s.stock||0)>0).map(s=>`<option value="${s.size}">${s.size}码 (库存${s.stock})</option>`).join('');
  document.getElementById('modalContent').innerHTML = `
    <h3>售出 - ${prod.name}</h3>
    <div style="background:var(--gray-1);padding:12px;border-radius:10px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>当前库存</span><span style="font-weight:600">${prodStock(prod)}双</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span>进货成本</span><span style="font-weight:600">¥${prod.cost}</span></div>
    </div>
    <div class="modal-field">
      <label>售出尺码</label>
      <select class="input" id="qsSize" ${sizesHtml?'':'disabled'}>${sizesHtml||'<option value="">无可用尺码</option>'}</select>
    </div>
    <div class="modal-field">
      <label>出售数量</label>
      <input type="number" class="input" id="qsQty" value="1" min="1" max="${prodStock(prod)}" oninput="calcQuickSell()">
    </div>
    <div class="modal-field">
      <label>实际售价 ¥</label>
      <input type="number" class="input" id="qsPrice" value="${prod.price}" oninput="calcQuickSell()">
    </div>
    <div id="qsPreview" style="background:var(--green-light);padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:700;color:var(--green)"></div>

      <button class="btn btn-outline" onclick="closeModal()">取消</button>

    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  calcQuickSell();
}

function calcQuickSell() {
  const qty = parseInt(document.getElementById('qsQty').value) || 0;
  const price = parseFloat(document.getElementById('qsPrice').value) || 0;
  const data = loadShoesV2();
  const prod = data.products.find(p=>p.id===currentDetailProductId);
  if (!prod) return;
  const profit = (price - prod.cost) * qty;
  const el = document.getElementById('qsPreview');
  el.textContent = `预计利润: ${profit>=0?'+':''}¥${profit.toFixed(2)}`;
  el.style.background = profit>=0?'var(--green-light)':'var(--red-light)';
  el.style.color = profit>=0?'var(--green)':'var(--red)';
}

function confirmQuickSell(pid) {
  const data = loadShoesV2();
  const qty = parseInt(document.getElementById('qsQty').value);
  const price = parseFloat(document.getElementById('qsPrice').value);
  const size = (document.getElementById('qsSize').value||'').trim();
  const prod = data.products.find(p=>p.id===pid);
  if (!size) { toast('请选择售出尺码'); return; }
  if (qty > getSizeStock(prod, size)) { toast('该尺码库存不足'); return; }
  removeSizeStock(prod, size, qty);
  if (prodStock(prod) <= 0) prod.status = '已售出';
  const profit = price - prod.cost;
  prod.flowLog.push({type:'销售', time:D(), note:`售出 ${size}码 ${qty}双 ¥${price} 利润¥${profit}`});

  data.outboundOrders.push({
    id: genId('out'), date: D(), warehouse: data.warehouses[0].id, tracking:'', note:'快速出售', shelf: prod.shelf||'',
    items:[{productId:pid, size, qty, price, cost: prod.cost, shippingFee:0, otherFee:0, profit}]
  });
  saveShoesV2(data);
  closeModal();
  renderShoesInventory();
  showProductDetail(pid);
  toast('售出成功');
}

function confirmDefectReg() {
  const data = loadShoesV2();
  const productId = document.getElementById('defProduct').value;
  const location = document.getElementById('defLocation').value.trim();
  const repairable = document.querySelector('input[name="defRepairable"]:checked').value === 'true';
  const note = document.getElementById('defNote').value.trim();
  let dispose = '';
  let status = '未修复';
  if (!repairable) {
    const dispSel = document.getElementById('defDispose');
    dispose = dispSel ? dispSel.value : '';
    status = dispose || '待闲鱼出售';
  }
  if (!location) { toast('请填写瑕疵位置描述'); return; }
  const prod = data.products.find(p => p.id === productId);
  const defectId = genId('d');
  data.defects.push({
    id: defectId, productId, location, repairable, status, dispose, note,
    repairCost: 0, createdAt: D(), repairedAt: null
  });
  if (prod) {
    prod.status = repairable ? '瑕疵-待修复' : '瑕疵-待处理';
    prod.flowLog.push({type:'瑕疵登记', time: D(), note:`${location} (${repairable?'可修复':'不可修复'})`, defectId});
  }
  saveShoesV2(data);
  closeModal();
  switchShoesTab('defects');

function confirmMarkRepaired(defectId) {
  const data = loadShoesV2();
  const def = data.defects.find(d => d.id === defectId);
  if (!def) return;
  const repairCost = parseFloat(document.getElementById('repairCost').value) || 0;
  const repairNote = document.getElementById('repairNote').value.trim();
  def.status = '已修复';
  def.repairCost = repairCost;
  def.repairedAt = D();
  if (repairNote) def.note = (def.note ? def.note + ' | ' : '') + '修复备注:' + repairNote;
  const prod = data.products.find(p => p.id === def.productId);
  if (prod) {
    prod.status = '瑕疵-已修复';
    prod.flowLog.push({type:'瑕疵修复', time: D(), note:`${def.location} 修复完成 ¥${repairCost}`, repairCost});

  saveShoesV2(data);
  closeModal();
  renderShoesDefects();
  toast('已标记修复完成');
}

function setDefectDispose(defectId, dispose) {
  if (!dispose) return;
  const data = loadShoesV2();
  const def = data.defects.find(d => d.id === defectId);
  if (!def) return;
  def.status = dispose;
  def.dispose = dispose;
  const prod = data.products.find(p => p.id === def.productId);
  if (prod) {
    prod.flowLog.push({type:'瑕疵处置', time: D(), note:`处置方案: ${dispose === '待闲鱼出售' ? '闲鱼出售' : '换货退回商家'}`, dispose});
  }
  saveShoesV2(data);
  renderShoesDefects();
  toast('已设置处置方案');
}

function completeDefectDispose(defectId) {
  const data = loadShoesV2();
  const def = data.defects.find(d => d.id === defectId);
  if (!def) return;
  def.status = '处理完成';
  const prod = data.products.find(p => p.id === def.productId);
  if (prod) {
    prod.status = '正常可售';
    prod.flowLog.push({type:'瑕疵处置', time: D(), note:`瑕疵处理完成: ${def.dispose}`, dispose: def.dispose});
  }
  saveShoesV2(data);
  renderShoesDefects();
  toast('瑕疵处理完成');
}

  document.getElementById('foodKcal').value = kcal;
  document.getElementById('foodInput').value = '';
  document.getElementById('foodDropdown').classList.remove('show');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.food-search')) {
    const dd = document.getElementById('foodDropdown');
    if (dd) dd.classList.remove('show');
  }
});

function addFood() {
  const name = document.getElementById('foodName').value.trim();
  const grams = parseFloat(document.getElementById('foodGrams').value);
  const kcalPer100 = parseFloat(document.getElementById('foodKcal').value);
  const meal = document.getElementById('foodMeal').value;
  if (!name || !grams || !kcalPer100) { toast('请填写完整信息'); return; }
  const kcal = Math.round(kcalPer100 * grams / 100);
  const data = load('diet', {breakfast:[],lunch:[],dinner:[],snack:[]});
  data[meal].push({name, grams, kcal, kcalPer100});
  save('diet', data);
  document.getElementById('foodName').value = '';
  document.getElementById('foodGrams').value = '';
  document.getElementById('foodKcal').value = '';
  renderDiet();
  renderHome();
  toast(`已添加 ${name} +${kcal}kcal`);
}

function delFood(meal, i) {
  const data = load('diet', {breakfast:[],lunch:[],dinner:[],snack:[]});
  data[meal].splice(i, 1);
  save('diet', data);
  renderDiet();
  renderHome();
}

function renderDiet() {
  const goal = getCalGoal();
  document.getElementById('calGoal').value = goal;
  const data = load('diet', {breakfast:[],lunch:[],dinner:[],snack:[]});
  const mealNames = {breakfast:'早餐', lunch:'午餐', dinner:'晚餐', snack:'加餐'};
  const mealIcons = {breakfast:'🌅', lunch:'☀️', dinner:'🌙', snack:'🍪'};
  let totalKcal = 0;
  let html = '';
  for (const meal of ['breakfast','lunch','dinner','snack']) {
    const items = data[meal];
    const mealKcal = items.reduce((s,f) => s + f.kcal, 0);
    totalKcal += mealKcal;
    html += `<div class="diet-meal">
      <div class="diet-meal-title">${mealIcons[meal]} ${mealNames[meal]} <span class="mk">${mealKcal} kcal</span></div>`;
    if (items.length === 0) {
      html += '<div style="font-size:12px;color:var(--gray-4);padding:4px 0">暂无记录</div>';
    } else {
      items.forEach((f, i) => {
        html += `<div class="diet-entry">
          <span class="d-name">${f.name}</span>
          <span class="d-grams">${f.grams}g</span>
          <span class="d-kcal">${f.kcal} kcal</span>
          <button class="icon-btn" onclick="delFood('${meal}', ${i})">×</button>
        </div>`;
      });
    }
    html += '</div>';
  }
  document.getElementById('dietList').innerHTML = html;
  document.getElementById('totalKcal').textContent = totalKcal + ' kcal';
  const pct = Math.min(100, totalKcal / goal * 100);
  const fill = document.getElementById('calorieFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('over', totalKcal > goal);
  document.getElementById('calGoalLabel').textContent = '/ ' + goal + ' kcal';
}

function todayKey() {
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

// ===== 拖拽（回弹 / FLIP 重排 / 跨象限移动 / 侧滑操作） =====
let suppressCardClick = false;
let openRow = null;

function flipSiblings(siblings) {
  const first = siblings.map(s => s.getBoundingClientRect().top);
  return () => {
    siblings.forEach((s, i) => {
      const last = s.getBoundingClientRect().top;
      const dy = first[i] - last;
      if (Math.abs(dy) > 1) {
        s.style.transition = 'none';
        s.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => {
          s.style.transition = 'transform .26s var(--ease-out)';
          s.style.transform = '';
        });
      }
    });
  };
}

function setupDrag(container, mode) {
  if (!container) return;
  const sel = mode === 'schedule' ? '.task-row' : '.quad-task';
  const THRESH = 8, ACT = 10, HOLD = 200;
  let card, front, placeholder, startX, startY, grabDX, grabDY, dragging = false, mode2 = null, longTimer = null, pid = null;

  function frontOf(el) { return mode === 'schedule' ? el.querySelector('.task-card') : el; }
  function actionsWidth() { const a = card && card.querySelector('.task-actions'); return a ? a.offsetWidth : 132; }

  container.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // 触屏左边缘留给全局手势（侧边栏拉出 / 返回），不与卡片滑动冲突
    if (isTouch && e.clientX < 28) return;
    const t = e.target.closest(sel);
    if (!t) return;
    if (e.target.closest('.task-check') || e.target.closest('.ts-action') || e.target.closest('.task-actions') || e.target.closest('select') || e.target.closest('option')) return;
    card = t; front = frontOf(card); startX = e.clientX; startY = e.clientY; dragging = false; mode2 = null; pid = e.pointerId;
    longTimer = setTimeout(() => beginDrag(e), HOLD);
  });

  function beginDrag(e) {
    const rect = card.getBoundingClientRect();
    grabDX = startX - rect.left; grabDY = startY - rect.top;
    placeholder = document.createElement('div');
    placeholder.className = 'drag-placeholder';
    placeholder.style.height = rect.height + 'px';
    placeholder.style.marginBottom = '6px';
    card.parentNode.insertBefore(placeholder, card);
    card.style.position = 'fixed';
    card.style.width = rect.width + 'px';
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';
    card.style.margin = '0';
    card.style.zIndex = '60';
    card.classList.add('dragging');
    document.body.style.userSelect = 'none';
    try { card.setPointerCapture && card.setPointerCapture(pid); } catch (e) {}
    positionCard(e);
    dragging = true; mode2 = 'drag';
  }

  function positionCard(e) {
    card.style.left = (e.clientX - grabDX) + 'px';
    card.style.top = (e.clientY - grabDY) + 'px';
  }
  function clearPlaceholder() { if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder); }

  container.addEventListener('pointermove', (e) => {
    if (!card) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (mode2 === 'swipe') {
      const AW = actionsWidth();
      front.style.transform = `translateX(${Math.max(-AW, Math.min(0, dx))}px)`;
      e.preventDefault();
      return;
    }
    if (mode2 === 'drag') {
      e.preventDefault();
      positionCard(e);
      if (mode === 'schedule') {
        const sibs = [...container.querySelectorAll(sel)].filter(c => c !== card && c !== placeholder);
        const apply = flipSiblings(sibs);
        let target = null;
        for (const s of sibs) { const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { target = s; break; } }
        if (target) container.insertBefore(placeholder, target); else container.appendChild(placeholder);
        apply();
      } else {
        const prevVis = card.style.visibility; card.style.visibility = 'hidden';
        const col = document.elementFromPoint(e.clientX, e.clientY); card.style.visibility = prevVis;
        const qcol = col && col.closest('.quad-col');
        if (qcol) {
          const cards = [...qcol.querySelectorAll(sel)].filter(c => c !== card);
          const apply = flipSiblings(cards);
          let target = null;
          for (const s of cards) { const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { target = s; break; } }
          if (target) qcol.insertBefore(placeholder, target);
          else { const last = qcol.querySelector(sel + ':last-of-type'); if (last) last.after(placeholder); else qcol.appendChild(placeholder); }
          apply();
          document.querySelectorAll('.quad-col').forEach(c => c.classList.toggle('drop-hover', c === qcol));
        }
      }
      return;
    }
    // 未决定
    if (Math.hypot(dx, dy) <= THRESH) return;
    if (e.pointerType !== 'mouse' && Math.abs(dx) >= Math.abs(dy) && Math.abs(dx) > ACT) {
      mode2 = 'swipe'; clearTimeout(longTimer);
      card.classList.add('swiping'); front.style.transition = 'none';
      if (openRow && openRow !== card) closeRow(openRow);
      e.preventDefault();
      return;
    }
    if (Math.abs(dy) > Math.abs(dx)) {
      if (!dragging) { clearTimeout(longTimer); card = null; }
      return;
    }
  });

  function reset(cardEl) {
    cardEl.style.position = ''; cardEl.style.width = ''; cardEl.style.left = '';
    cardEl.style.top = ''; cardEl.style.margin = ''; cardEl.style.zIndex = '';
    cardEl.classList.remove('dragging'); document.body.style.userSelect = '';
  }

  container.addEventListener('pointerup', (e) => {
    clearTimeout(longTimer);
    if (!card) return;
    if (mode2 === 'swipe') {
      const AW = actionsWidth(); const dx = e.clientX - startX;
      card.classList.remove('swiping');
      if (dx <= -AW * 0.4) { card.classList.add('open'); openRow = card; front.style.transition = ''; front.style.transform = `translateX(${-AW}px)`; }
      else { if (openRow === card) openRow = null; card.classList.remove('open'); front.style.transition = ''; front.style.transform = ''; }
      suppressCardClick = true; setTimeout(() => suppressCardClick = false, 60);
    } else if (mode2 === 'drag') {
      e.preventDefault();
      if (mode === 'schedule') {
        const seq = []; let node = container.firstChild;
        while (node) {
          if (node === placeholder) seq.push(card.dataset.taskId);
          else if (node.classList && node.classList.contains('task-row') && node !== card) seq.push(node.dataset.taskId);
          node = node.nextSibling;
        }
        const store = loadScheduleStore();
        seq.forEach((id, i) => { const tk = store.tasks.find(x => x.id === id); if (tk) tk.order = i; });
        saveScheduleStore(store);
        if (placeholder.parentNode) placeholder.parentNode.insertBefore(card, placeholder);
        clearPlaceholder(); reset(card);
        card.classList.add('drag-bounce'); card.addEventListener('animationend', () => card.classList.remove('drag-bounce'), { once: true });
      } else {
        const col = placeholder.parentNode && placeholder.parentNode.closest('.quad-col');
        const id = card.dataset.taskId;
        clearPlaceholder(); reset(card);
        document.querySelectorAll('.quad-col').forEach(c => c.classList.remove('drop-hover'));
        if (col && col.dataset.quad) moveTaskQuadrant(id, col.dataset.quad); else renderQuadrant();
      }
      suppressCardClick = true; setTimeout(() => suppressCardClick = false, 60);
    }
    card = null; dragging = false; mode2 = null;
  });

  container.addEventListener('pointercancel', () => {
    clearTimeout(longTimer);
    if (card && dragging) { clearPlaceholder(); reset(card); }
    if (card && mode2 === 'swipe') { card.classList.remove('swiping'); if (openRow === card) openRow = null; front.style.transform = ''; }
    document.querySelectorAll('.quad-col').forEach(c => c.classList.remove('drop-hover'));
    card = null; dragging = false; mode2 = null;
  });
}

function closeRow(row) {
  if (!row) return;
  row.classList.remove('open', 'swiping');
  const f = row.querySelector('.task-card');
  if (f) { f.style.transition = ''; f.style.transform = ''; }
  if (openRow === row) openRow = null;
}

function initDrag() {
  setupDrag(document.getElementById('scheduleList'), 'schedule');
  setupDrag(document.getElementById('quadGrid'), 'quadrant');
  ['scheduleList', 'quadGrid'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', (e) => {
      if (suppressCardClick) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  });
}

// ===== 全局手势（侧边栏边缘 / 返回 / 弹窗下滑）— 仅触屏 =====
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function initGestures() {
  if (!isTouch) return;
  const EDGE = 22;
  const sb = () => document.getElementById('sidebar');
  const modal = () => document.getElementById('modalOverlay');
  let startX = 0, startY = 0, active = false, decided = false, horiz = false, dir = 0, gType = 'none', W = 220;

  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    if (document.getElementById('imgLightbox').classList.contains('show')) return;
    if (e.target.closest('input, textarea, select, button')) return;
    startX = e.clientX; startY = e.clientY; active = true; decided = false; horiz = false; dir = 0; gType = 'none';
  }, { passive: true });

  document.addEventListener('pointermove', (e) => {
    if (!active || e.pointerType === 'mouse') return;
    if (document.getElementById('imgLightbox').classList.contains('show')) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!decided) {
      if (Math.hypot(dx, dy) < 10) return;
      horiz = Math.abs(dx) > Math.abs(dy);
      dir = dx > 0 ? 1 : -1;
      decided = true;
      const mOpen = modal().classList.contains('show');
      const sOpen = sb().classList.contains('expanded');
      if (mOpen) gType = 'modal';
      else if (sOpen) gType = (dir < 0) ? 'closeSidebar' : 'none';
      else if (startX < EDGE && dir > 0) gType = 'openSidebar';
      else if (dir > 0) gType = 'back';
      else gType = 'none';
      if (gType !== 'none' && gType !== 'back') e.preventDefault();
    }
    if (!horiz) return; // 纵向交给原生滚动
    if (gType === 'openSidebar') {
      e.preventDefault();
      W = sb().getBoundingClientRect().width || 220;
      sb().classList.add('gesture');
      sb().style.transform = `translateX(${Math.max(-W, Math.min(0, dx - W))}px)`;
    } else if (gType === 'closeSidebar') {
      e.preventDefault();
      W = sb().getBoundingClientRect().width || 220;
      sb().classList.add('gesture');
      sb().style.transform = `translateX(${Math.max(-W, Math.min(0, dx))}px)`;
    } else if (gType === 'modal') {
      const mc = modal().querySelector('.modal');
      const sc = modal().querySelector('.modal-content') || mc;
      if (!mc) return;
      if (sc.scrollTop > 0) return;       // 内容可滚动，交给原生
      if (dy < 0) return;
      e.preventDefault();
      modal().classList.add('gesture');
      mc.style.transform = `translateY(${dy}px)`;
      modal().style.opacity = String(Math.max(0, 1 - dy / 400));
    } else if (gType === 'back') {
      e.preventDefault();
    }
  }, { passive: false });

  function finish(e) {
    if (!active) return;
    active = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (gType === 'openSidebar') {
      sb().classList.remove('gesture');
      if (dx > W * 0.4) sb().classList.add('expanded'); else sb().classList.remove('expanded');
      sb().style.transform = '';
    } else if (gType === 'closeSidebar') {
      sb().classList.remove('gesture');
      if (dx < -W * 0.4) sb().classList.remove('expanded'); else sb().classList.add('expanded');
      sb().style.transform = '';
    } else if (gType === 'modal') {
      const mc = modal().querySelector('.modal');
      modal().classList.remove('gesture');
      modal().style.opacity = '';
      if (dy > 120) closeModal(); else if (mc) mc.style.transform = '';
    } else if (gType === 'back') {
      if (dx > 80 && dx > Math.abs(dy)) goBack();
    }
    gType = 'none';
  }
  document.addEventListener('pointerup', finish, { passive: true });
  document.addEventListener('pointercancel', () => {
    active = false;
    if (gType === 'modal') { const mc = modal().querySelector('.modal'); modal().classList.remove('gesture'); modal().style.opacity = ''; if (mc) mc.style.transform = ''; }
    if (gType === 'openSidebar' || gType === 'closeSidebar') { sb().classList.remove('gesture'); sb().style.transform = ''; }
    gType = 'none';
  });
}

// ===== 键盘适配（移动端不放大、不卡死、顺滑还原） =====
function setupKeyboardAdapt() {
  const frame = document.querySelector('.phone-frame');
  if (!frame || !window.visualViewport) return;
  const vv = window.visualViewport;
  const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  let raf = null;
  const apply = () => {
    const h = Math.round(vv.height);
    frame.style.height = h + 'px';
    if (isMobile) frame.style.minHeight = h + 'px';
    frame.style.transition = 'height 0.25s var(--ease)';
  };
  vv.addEventListener('resize', () => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(apply); });
  vv.addEventListener('scroll', () => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(apply); });
  // 聚焦输入框时，等键盘动画后把字段滚入可视区
  document.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) {
      setTimeout(() => { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }, 280);
    }
  });
  apply();
}

// ===== 图片预览 lightbox =====
let lbScale = 1, lbX = 0, lbY = 0;
const lbPointers = new Map();
let lbStartDist = 0, lbStartScale = 1, lbStartMid = null, lbLastTap = 0, lbLastTapPos = null;

function applyLb() {
  const img = document.getElementById('lbImg');
  if (img) img.style.transform = `translate(${lbX}px, ${lbY}px) scale(${lbScale})`;
}
function openLightbox(src) {
  const lb = document.getElementById('imgLightbox');
  const img = document.getElementById('lbImg');
  img.src = src; lbScale = 1; lbX = 0; lbY = 0; applyLb();
  lb.classList.add('show');
}
function closeLightbox() {
  document.getElementById('imgLightbox').classList.remove('show');
}
(function setupLightbox() {
  const lb = document.getElementById('imgLightbox');
  if (!lb) return;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  lb.addEventListener('pointerdown', (e) => {
    lb.setPointerCapture && lb.setPointerCapture(e.pointerId);
    lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbPointers.size === 2) {
      const p = [...lbPointers.values()];
      lbStartDist = dist(p[0], p[1]); lbStartScale = lbScale;
      lbStartMid = mid(p[0], p[1]);
    } else if (lbPointers.size === 1) {
      // 双击检测
      const now = Date.now();
      if (now - lbLastTap < 300 && lbLastTapPos && Math.hypot(e.clientX - lbLastTapPos.x, e.clientY - lbLastTapPos.y) < 30) {
        lbScale = lbScale > 1.2 ? 1 : 2.5; if (lbScale === 1) { lbX = 0; lbY = 0; } applyLb();
        lbLastTap = 0;
      } else { lbLastTap = now; lbLastTapPos = { x: e.clientX, y: e.clientY }; }
    }
  });
  lb.addEventListener('pointermove', (e) => {
    if (!lbPointers.has(e.pointerId)) return;
    lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbPointers.size === 2) {
      const p = [...lbPointers.values()];
      const d = dist(p[0], p[1]);
      lbScale = Math.max(1, Math.min(5, lbStartScale * d / (lbStartDist || 1)));
      applyLb();
    } else if (lbPointers.size === 1 && lbScale > 1) {
      lbX += e.clientX - (lb._lastX != null ? lb._lastX : e.clientX);
      lbY += e.clientY - (lb._lastY != null ? lb._lastY : e.clientY);
      applyLb();
    }
    lb._lastX = e.clientX; lb._lastY = e.clientY;
  });
  function up(e) {
    if (lbPointers.has(e.pointerId)) lbPointers.delete(e.pointerId);
    if (lbPointers.size < 2) { lbStartDist = 0; lbStartMid = null; }
    lb._lastX = null; lb._lastY = null;
    // 单指上滑关闭（scale==1 时）
    if (lbPointers.size === 0 && lbScale === 1 && e.clientY - (lb._downY != null ? lb._downY : e.clientY) > 100) closeLightbox();
  }
  lb.addEventListener('pointerup', up);
  lb.addEventListener('pointercancel', up);
  lb.addEventListener('pointerdown', (e) => { lb._downY = e.clientY; });
  // 点击空白处（非图片/关闭按钮）关闭
  lb.addEventListener('click', (e) => {
    if (e.target === lb || e.target.classList.contains('lb-hint')) closeLightbox();
  });
})();
// 代理：点击可缩放图片打开预览（捕获阶段，避免触发外层卡片点击）
document.addEventListener('click', (e) => {
  const img = e.target.closest('img.zoomable');
  if (img && !document.getElementById('imgLightbox').classList.contains('show')) {
    e.stopPropagation();
    e.preventDefault();
    openLightbox(img.getAttribute('src'));
  }
}, true);

// ===== 更新机制：清掉旧缓存 + 自动检测新版 =====
// 旧版用 blob:URL 注册 ServiceWorker，scope 不匹配、会把页面锁在旧缓存里，这里全部注销干净
function cleanupOldCache() {
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(rs) {
        rs.forEach(function(r) { r.unregister().catch(function(){}); });
      }).catch(function(){});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function(ks) { ks.forEach(function(k) { caches.delete(k); }); }).catch(function(){});
    }
  } catch(e) {}
}

// 拉最新版 HTML 比对版本号
async function checkAppUpdate() {
  try {
    const url = new URL(location.href);
    url.search = '';                       // 去掉旧版本号参数
    url.searchParams.set('_t', Date.now());
    const res = await fetch(url.toString(), { cache: 'no-store' });
    if (!res.ok) return false;
    const html = await res.text();
    const m = html.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if (m && m[1] && m[1] !== APP_VERSION) return m[1];
  } catch (e) {}
  return false;
}

// 强制刷新到最新版（带新版本号参数，绕过一切缓存）
function forceUpdateApp(ver) {
  try {
    const url = new URL(location.href);
    url.searchParams.set('v', ver || Date.now());
    location.replace(url.toString());
  } catch (e) { location.reload(); }
}

function showUpdateBanner(ver) {
  if (document.getElementById('updateBanner')) return;
  const el = document.createElement('div');
  el.id = 'updateBanner';
  el.innerHTML = `发现新版本 <b>${ver}</b>，点此立即更新`;
  el.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:#3f82f6;color:#fff;' +
    'padding:12px 14px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;text-align:center';
  el.onclick = function() { el.remove(); forceUpdateApp(ver); };
  document.body.appendChild(el);
}

async function manualCheckUpdate(force) {
  cleanupOldCache();
  const ver = await checkAppUpdate();
  if (ver) { forceUpdateApp(ver); return; }
  if (force) {
    if (!confirm('当前已经是最新版（' + APP_VERSION + '）。仍要强制重新加载吗？')) return;
    forceUpdateApp();
  }
}

// 启动 1.2s 后自动检测：发现新版就自动更新（同一个版本只自动一次，避免反复刷新）
setTimeout(async function() {
  cleanupOldCache();
  const ver = await checkAppUpdate();
  if (!ver) return;
  const tried = sessionStorage.getItem('wb_update_tried');
  if (tried === ver) { showUpdateBanner(ver); return; }   // 已自动试过，改为手动提示
  sessionStorage.setItem('wb_update_tried', ver);
  try { toast('发现新版本 ' + ver + '，正在更新…'); } catch(e){}
  setTimeout(function() { forceUpdateApp(ver); }, 800);
}, 1200);
